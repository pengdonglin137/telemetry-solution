[tox]
requires =
    tox-uv>=1.35.2
envlist =
    codestyle
    py312
    py311
    py310
    pkg_meta
    mypy
isolated_build = true
skip_missing_interpreters = true
minversion = 3.22

[testenv]
description = run the tests with pytest under {envname}
runner = uv-venv-lock-runner
extras =
    test
commands =
    python -m pytest --junitxml=reports/junit-{envname}.xml
package = wheel
wheel_build_env = .pkg

[testenv:mypy]
description = run mypy static type checks
dependency_groups =
    type
commands =
    mypy --config-file=pyproject.toml topdown_tool

[testenv:codestyle]
description = review the code styles
passenv =
    {[testenv]passenv}
    PRE_COMMIT_HOME
    PROGRAMDATA
    XDG_CACHE_HOME
package = skip
dependency_groups =
    lint
commands =
    pre-commit run --show-diff-on-failure --all-files
    pylint topdown_tool

[testenv:pkg_meta]
description = check that the long description is valid
package = skip
dependency_groups =
    pkg-meta
commands =
    python -m build -o {envtmpdir} -s -w .
    twine check {envtmpdir}{/}*
    check-wheel-contents {envtmpdir}
