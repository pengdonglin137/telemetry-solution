default:
  # cancel the job if a new pipeline is triggered on the same branch
  interruptible: true

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

include:
  - project: "software/upe/valetudo/codex-gitlab-review"
    ref: "main"
    file: "/.gitlab/review-template.yml"

stages:
  - pre-check
  - docker-check
  - prepare
  - build-and-test
  - release
  - review

###
# Prepare: Docker build
###
variables:
  DOCKER_REGISTRY_KEY: "oss-android--docker"
  ARTIFACTORY_REGISTRY_URL: "${DOCKER_REGISTRY_KEY}.${ARTIFACTORY_HOST}"
  REGISTRY_IMAGE_X86_64: "${ARTIFACTORY_REGISTRY_URL}/telemetry-solution-x86_64:$CI_COMMIT_REF_SLUG" # Not in use at the moment
  REGISTRY_IMAGE_AARCH64: "${ARTIFACTORY_REGISTRY_URL}/telemetry-solution-aarch64:$CI_COMMIT_REF_SLUG"
  UV_PYTHON_DOWNLOADS: "never"

commit-message-check:
  stage: pre-check
  tags: [linux_x86_64]
  image: python:3.10.18-bullseye
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
  script:
    - |
      set -euo pipefail

      echo "Checking commit messages in MR !${CI_MERGE_REQUEST_IID}"

      RANGE="${CI_MERGE_REQUEST_DIFF_BASE_SHA}..${CI_COMMIT_SHA}"
      echo "Commit range: ${RANGE}"

      commits="$(git rev-list --reverse "${RANGE}")"

      if [ -z "${commits}" ]; then
        echo "No commits found in MR range"
        exit 0
      fi

      failed=0

      for sha in ${commits}; do
        short_sha="$(git rev-parse --short "${sha}")"
        headline="$(git log -1 --format=%s "${sha}")"
        echo "Validating commit ${short_sha}: ${headline}"      

        tmpfile="$(mktemp)"
        git log -1 --format=%B "${sha}" > "${tmpfile}"

        if ! python .ci/commit-msg-checker.py "${tmpfile}"; then
          failed=1
        fi

        rm -f "${tmpfile}"
      done

      if [ "${failed}" -ne 0 ]; then
        echo
        echo "Commit message validation failed."
        exit 1
      fi

      echo "All commit messages are valid."

# check-docker-tag validates if the docker image is available in artifactory.
# It sets the variable DOCKER_IMAGE_NOT_PRESENT_IN_REGISTRY which is shared
# with subsequent jobs
check-docker-tag:
  stage: docker-check
  tags: [linux_x86_64]
  image: badouralix/curl-jq:alpine
  variables:
    GIT_STRATEGY: none
  script: 
    - curl -u ${ARTIFACTORY_USER}:${ARTIFACTORY_API_KEY}  -X GET ${ARTIFACTORY_URL}/artifactory/api/docker/${DOCKER_REGISTRY_KEY}/v2/telemetry-solution-x86_64/tags/list > tags
    - cat tags | jq ".tags | index(\"$CI_COMMIT_REF_SLUG\")" > docker-image-index || true
    - |-
        if [[ "$(cat docker-image-index)" == null ]]; then
          echo "DOCKER_IMAGE_NOT_PRESENT_IN_REGISTRY=1" >> build.env
        else
          echo "DOCKER_IMAGE_NOT_PRESENT_IN_REGISTRY=0" >> build.env
        fi
  artifacts:
    paths:
      - tags
      - docker-image-index
    reports:
      dotenv: build.env
 
# check-docker-change sets DOCKERFILE_CHANGED to 1 if the Dockerfile 
# has changed or if the pipeline is not part of a merge request. 
# Comparison is made with the target branch.
check-docker-change:
  stage: docker-check
  tags: [linux_x86_64]
  image: alpine:3.20.2
  variables:
    GIT_STRATEGY: none
  needs: 
    - check-docker-tag
  script: echo "DOCKERFILE_CHANGED=1" >> build.env
  rules:
    - changes:
        - .ci/Dockerfile
    - when: never
  artifacts:
    reports:
      dotenv: build.env

# Build the docker image if the image is not present in the registry or 
# if the dockerfile has changed.
.build-docker:
  image:
    name: mirrors--gcr-io.${ARTIFACTORY_HOST}/kaniko-project/executor:debug
    entrypoint: [""]
  stage: prepare
  script:
    - |-
      if [ "$DOCKER_IMAGE_NOT_PRESENT_IN_REGISTRY" == "1" ] || [ "$DOCKERFILE_CHANGED" == "1" ]; then
        mkdir -p /kaniko/.docker
        echo "{\"auths\":{\"${ARTIFACTORY_REGISTRY_URL}\":{\"auth\":\"$(printf "%s:%s" "${ARTIFACTORY_USER}" "${ARTIFACTORY_API_KEY}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        /kaniko/executor \
          --registry-mirror mirrors--dockerhub.${ARTIFACTORY_HOST} \
          --context "${CI_PROJECT_DIR}" \
          --dockerfile "${CI_PROJECT_DIR}/.ci/Dockerfile" \
          ${CI_IMAGE_DOCKER_BASE:+--build-arg DOCKER_BASE=${CI_IMAGE_DOCKER_BASE}} \
          ${CI_IMAGE_APT_PORTS_MIRROR_URL:+--build-arg APT_PORTS_MIRROR_URL=${CI_IMAGE_APT_PORTS_MIRROR_URL}} \
          ${CI_IMAGE_APT_ARCHIVE_MIRROR_URL:+--build-arg APT_ARCHIVE_MIRROR_URL=${CI_IMAGE_APT_ARCHIVE_MIRROR_URL}} \
          ${CI_IMAGE_APT_SECURITY_MIRROR_URL:+--build-arg APT_SECURITY_MIRROR_URL=${CI_IMAGE_APT_SECURITY_MIRROR_URL}} \
          --destination "${REGISTRY_IMAGE}"
      fi

build-docker-x64:
  variables:
    REGISTRY_IMAGE: $REGISTRY_IMAGE_X86_64
  extends: .build-docker
  tags: [linux_x86_64]

###
# Build and test:
###

# Base job for all the build and test jobs.
# It declares: The image, tag, cache and artifacts to use
.build-base:
  image: $REGISTRY_IMAGE_X86_64
  tags: [linux_x86_64]
  stage: build-and-test

uv-lock-check:
  extends: .build-base
  script:
    - |
      set -euo pipefail

      lockfiles="$(find tools -path '*/.venv' -prune -o -name uv.lock -print | sort)"

      if [ -z "$lockfiles" ]; then
        echo "No per-project uv.lock files found."
        exit 0
      fi

      for lockfile in $lockfiles; do
        project_dir="$(dirname "$lockfile")"
        echo "Checking $project_dir"
        uv lock --directory "$project_dir" --check
      done

build-ustress:
  extends: .build-base
  parallel:
    matrix:
      - UARCH: [V1, V3, N1, N2]
        COMPILER: [aarch64-linux-gnu-gcc-10,aarch64-linux-gnu-gcc-13]
        USE_C_FLAG: [0, 1]
  script:
    - |
      cd benchmarks/ustress
      CC="$COMPILER" make CPU=NEOVERSE-"$UARCH" USE_C="$USE_C_FLAG"
      find . -type f -perm /111 -print | xargs zip "ustress-${UARCH}-${COMPILER}-USE_C-${USE_C_FLAG}.zip"
      make clean
  artifacts:
    paths:
      - benchmarks/ustress/ustress-*.zip
    expire_in: 7 days

ustress-charts:
  extends: .build-base
  script:
    - |
      cd tools/ustress_charts
      uv lock --check
      uv run --locked ./ustress-charts.py --help

build-sysstress:
  extends: .build-base
  script:
    - |
      cd benchmarks/sysstress
      mkdir bin
      cd bin
      CC=aarch64-linux-gnu-gcc-10 CXX=aarch64-linux-gnu-g++-10 cmake ..
      make
      EXECUTABLES=`find . -executable -type f -not -path "./CMakeFiles/*"`
      mkdir ../zip
      cp $EXECUTABLES ../zip/
      cd ../zip
      zip -9X ../sysstress.zip *
  artifacts:
    paths:
      - benchmarks/sysstress/sysstress.zip
    expire_in: 7 days

build-random-pointer-access:
  extends: .build-base
  script:
    - |
      cd benchmarks/random_pointer_access
      make
      mkdir -p artifacts
      cp random_pointer_access artifacts/
      make clean
  artifacts:
    paths:
      - benchmarks/random_pointer_access/artifacts/*
    expire_in: 7 days

build-matmul:
  extends: .build-base
  script:
    - |
      cd benchmarks/matmul
      make
      mkdir -p artifacts
      cp matmul_baseline matmul_ikj matmul_ikj_blocked artifacts/
      make clean
  artifacts:
    paths:
      - benchmarks/matmul/artifacts/*
    expire_in: 7 days

spe-parser:
  extends: .build-base
  parallel:
    matrix:
      - PYENV: 
        - py314
        - py313
        - py312
        - py311
        - py310
        - fix,type,pkg_meta
  script:
    - |
      uv run --directory tools/spe_parser --locked --group tox tox -e "$PYENV"
  artifacts:
    reports:
      junit:
        - tools/spe_parser/reports/*.xml

topdown-tool:
  extends: .build-base
  parallel:
    matrix:
      - PYENV: 
        - py312
        - py311
        - py310
        - codestyle,pkg_meta
        - mypy
  script:
    - |
      uv run --directory tools/topdown_tool --no-project --with tox tox -e "$PYENV"
  artifacts:
    reports:
      junit:
        - tools/topdown_tool/reports/*.xml

topdown-tool-blackduck:
  extends: .build-base
  rules:
    # Only in merge request pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      allow_failure: false
    # Elsewhere, don’t include this job
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
  script:
    - |
      BASELINE_VERSION=$(cat .ci/blackduck-baseline-version)
      cd tools/topdown_tool
      CURRENT_VERSION=$(uv run python -c 'from importlib.metadata import version; print(version("topdown-tool"))')-$CI_COMMIT_SHORT_SHA
      ../../.ci/blackduck-scan.sh $BASELINE_VERSION $CURRENT_VERSION $BLACKDUCK_TOPDOWN_TOOL_PROJECT_ID $BLACKDUCK_TOPDOWN_TOOL_PROJECT_NAME './topdown_tool,./tests'

validate-cpu-specs:
  extends: .build-base
  script:
    - |
      uv run --directory tools/topdown_tool validate-cpu-spec --spec-dir ../../data/pmu/cpu/specifications --schema-dir ../../data/pmu/cpu/schemas

perf-json-generator:
  extends: .build-base
  script:
    - |
      export WORKSPACE=$PWD
      pushd tools/perf_json_generator
      uv run --locked pre-commit run --all-files
      git clone --sparse --depth=1 --single-branch https://github.com/torvalds/linux.git
      pushd linux
      git sparse-checkout add tools/perf
      popd
      find $WORKSPACE/data/pmu/cpu/specifications/* -name '*.json' | grep -Ev 'schema|-sme2-' | xargs -I '{}' ./generate.py linux/tools/perf --telemetry-files '{}'
      pushd linux
      git diff --name-only > changed_files.txt
      git ls-files --others --exclude-standard >> changed_files.txt
      git diff > perf-update.patch
      mkdir -p artifacts
      while read file; do cp --parents "$file" artifacts/; done < changed_files.txt
      popd
      popd 
      mv tools/perf_json_generator/linux/artifacts/tools/perf/pmu-events/arch/arm64 tools/perf_json_generator/linux/perf-update.patch .
  artifacts:
    paths:
      - arm64
      - perf-update.patch
    reports:
      junit:
        - tools/perf_json_generator/reports/*.xml
    expose_as: 'Perf JSON'
    expire_in: 7 days

topdown-tool-create-package:
  extends: .build-base
  image: python:3.10.18-bullseye
  tags: [linux_arm64]
  when: manual
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - |
      apt update
      apt install -y binutils curl
      curl -LsSf https://astral.sh/uv/install.sh | env UV_UNMANAGED_INSTALL=/usr/local/bin sh
      cd tools/topdown_tool
      uv run --with pyinstaller pyinstaller --clean -Fsn topdown-tool --optimize 2 --bootloader-ignore-signals --copy-metadata topdown_tool \
        --hidden-import topdown_tool.cmn_probe.cmn_factory \
        --hidden-import topdown_tool.cpu_probe.cpu_factory \
        --add-data ../../data/pmu/cpu:topdown_tool/data/pmu/cpu \
        --add-data ../../data/pmu/cmn:topdown_tool/data/pmu/cmn \
        --add-data topdown_tool/cmn_probe/cmn-tools/:topdown_tool/cmn_probe/cmn-tools/ \
        topdown_tool/__main__.py
  artifacts:
    paths:
      - tools/topdown_tool/dist/topdown-tool

topdown-tool-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags: [linux_x86_64]
  needs:
    - job: topdown-tool-create-package
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
  script:
    - |
      PACKAGE_NAME="topdown-tool-${CI_COMMIT_TAG}-linux_arm64.tar.gz"
      BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      mkdir -p release
      cp tools/topdown_tool/dist/topdown-tool release/topdown-tool
      cp tools/topdown_tool/README*.md release/
      cat > release/VERSION.txt <<EOF
      tag=${CI_COMMIT_TAG}
      ref=${CI_COMMIT_REF_NAME}
      commit=${CI_COMMIT_SHA}
      build_date=${BUILD_DATE}
      pipeline=${CI_PIPELINE_URL}
      EOF
      (
        cd release
        tar -czf "${PACKAGE_NAME}" topdown-tool README*.md VERSION.txt
      )
  artifacts:
    paths:
      - release/*.tar.gz
      - release/VERSION.txt
      - release/README*.md
    expire_in: never
  release:
    tag_name: $CI_COMMIT_TAG
    name: "topdown-tool binary release $CI_COMMIT_TAG"
    description: "On-demand binary release generated from the package built in this tag pipeline."
    assets:
      links:
        - name: "topdown-tool-${CI_COMMIT_TAG}-linux_arm64"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/release/topdown-tool-${CI_COMMIT_TAG}-linux_arm64.tar.gz"
